<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOG PENCURI - MCHLERN LISENSI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>MCHLERN LISENSI STUDIO</h1>
    </header>
    <nav>
        <a href="index.html">TAMBAH</a>
        <a href="list.html">TER-ACC</a>
        <a href="scan.html" class="active">LOG PENCURI</a>
        <a href="blacklist.html">BLACKLIST</a>
    </nav>

    <div class="container">
        <h2>AUTO SCAN (ID YANG MENCOBA MEMAKAI KIT)</h2>
        <p style="font-size: 14px; margin-bottom: 20px;">> List di bawah ini otomatis muncul jika ada yang memakai script kamu tanpa izin.</p>
        <div id="scanList"></div>
    </div>

    <script>
        async function loadScanned() {
            const scanList = document.getElementById('scanList');
            try {
                const response = await fetch('/api/scanned');
                const places = await response.json();
                scanList.innerHTML = '';
                
                if (places.length === 0) {
                    scanList.innerHTML = '<p>> AMAN. BELUM ADA YANG MENCOBA MENCURI.</p>';
                    return;
                }

                places.forEach(id => {
                    const div = document.createElement('div');
                    div.className = 'list-item';
                    div.innerHTML = `
                        <span>Suspect ID: <strong>${id}</strong></span>
                        <div style="display: flex; gap: 5px;">
                            <button onclick="accPlace('${id}')" style="background:green;">ACC</button>
                            <button onclick="blacklistPlace('${id}')" style="background:darkred;">BLACKLIST</button>
                        </div>
                    `;
                    scanList.appendChild(div);
                });
            } catch (err) {
                scanList.innerHTML = '<p>> ERROR MEMUAT DATA.</p>';
            }
        }

        async function accPlace(id) {
            if (!confirm(`Izinkan (ACC) ID ${id} ini?`)) return;
            try {
                await fetch('/api/places', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ placeId: id })
                });
                loadScanned();
            } catch (err) { alert('> GAGAL ACC.'); }
        }

        async function blacklistPlace(id) {
            if (!confirm(`Masukkan ID ${id} ke Blacklist permanen?`)) return;
            try {
                await fetch('/api/blacklist', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ placeId: id })
                });
                loadScanned();
            } catch (err) { alert('> GAGAL BLACKLIST.'); }
        }

        loadScanned();
    </script>
</body>
</html>
